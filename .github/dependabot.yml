# Automated Phish Extractor — automated dependency updates
# Author: gurvinny
version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch only. A grouped PR does not expose per-dependency versions to
      # fetch-metadata, so the 0.x rule cannot be applied inside a group --
      # minors therefore arrive individually where they can be judged.
      patch:
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
